background {
    monitor = ""
    path = screenshot
    blur_passes = 0
    blur_size = 1
    noise = 0.0117
    contrast = 1.0
    brightness = 0.8
    vibrancy = 0.21
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(127, 127, 127, 0.4)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgba(224,223,207,1.0)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgba(224,223,207,1.0)
    font_size = 20
    font_family = Inter Bold
    position = 0, -35
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(224,223,207,1.0)
    font_size = 96
    font_family = Inter Bold
    position = 0, 60
    halign = center
    valign = center
}

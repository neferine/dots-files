general {
    immediate_render = true    # show fallback color while screenshot loads
    screencopy_mode = 1        # CPU screencopy (GPU DMA-BUF broken on this driver)
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = screenshot           # live desktop capture
    color = rgba(111,123,132,0.55)            # fallback tint if capture fails
    blur_passes = 2            # may not work (driver issue)
    blur_size = 4
    noise = 0.015               # grain texture
    contrast = 0.8
    brightness = 0.7
    vibrancy = 0.4
}

shape {
    monitor =
    size = 100%, 100%
    color = rgba(0, 0, 0, 0.12)  # subtle dark vignette for depth
}

input-field {
    monitor =
    size = 230, 35
    outline_thickness = 0
    dots_size = 0.-2
    dots_spacing = 0.02
    dots_center = true
    outer_color = rgba(121,134,143,0.5)
    inner_color = rgba(27,13,4,0.4)
    font_color = rgba(202,200,197,1.0)
    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <i>Freeze</i>
    hide_input = true
    position = 0, -120
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgba(155,136,115,1.0)
    font_size = 20
    font_family = Inter Bold
    position = 0, -35
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(111,123,132,1.0)
    font_size = 96
    font_family = Inter Bold
    position = 0, 60
    halign = center
    valign = center
}
